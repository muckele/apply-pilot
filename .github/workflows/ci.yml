name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/jobmatch_crm?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/jobmatch_crm?schema=public"
      AUTH_SECRET: "ci-auth-secret-for-build-validation-only"
      AUTH_URL: "http://localhost:3000"
      NEXTAUTH_URL: "http://localhost:3000"
      APP_BASE_URL: "http://localhost:3000"
      APP_VERSION: "ci"
      LOG_LEVEL: "warn"
      AUTH_ALLOWED_EMAILS: ""
      AUTH_ALLOW_PUBLIC_SIGNUPS: "false"
      ALLOW_DEMO_USER: "false"
      DEFAULT_DEMO_USER_ID: "demo-user"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: "gpt-4o-mini"
      OPENAI_MOCK_MODE: "true"
      GMAIL_REDIRECT_URI: "http://localhost:3000/api/gmail/callback"
      GMAIL_SCOPES: "https://www.googleapis.com/auth/gmail.readonly"
      TOKEN_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      MAX_UPLOAD_MB: "4"
      MAX_AUDIO_UPLOAD_MB: "4"
      MAX_DIRECT_AUDIO_UPLOAD_MB: "25"
      ADZUNA_COUNTRY: "us"
      THEIRSTACK_POSTED_MAX_AGE_DAYS: "30"
      SERPAPI_MAX_QUERIES_PER_RUN: "3"
      JOB_SOURCE_MAX_POSTED_AGE_DAYS: "30"
      CRON_SECRET: "ci-cron-secret"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  postgres-concurrency:
    name: PostgreSQL concurrency harness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apply_pilot_commit5_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apply_pilot_commit5_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: "test"
      COMMIT5_POSTGRES_TEST: "1"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/apply_pilot_commit5_test?schema=public"
      APPLICATION_AUTOMATION_ENABLED: "true"
      AI_ENABLED: "false"
      AI_MOCK_MODE: "true"
      GEMINI_API_KEY: ""
      MOONSHOT_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_MOCK_MODE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run PostgreSQL concurrency harness
        run: npm run test:postgres
